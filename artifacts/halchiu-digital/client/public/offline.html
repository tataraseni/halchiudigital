<!DOCTYPE html>
<html lang="ro">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Offline – Hălchiu Digital</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: #f5f7f5;
      color: #1a2e1a;
      min-height: 100dvh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 24px;
      text-align: center;
    }
    .icon {
      width: 72px;
      height: 72px;
      border-radius: 20px;
      background: #2d6a4f;
      display: flex;
      align-items: center;
      justify-content: center;
      margin: 0 auto 24px;
    }
    .icon svg { width: 36px; height: 36px; fill: none; stroke: white; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
    h1 { font-size: 22px; font-weight: 700; margin-bottom: 8px; }
    p  { font-size: 14px; color: #6b7f6b; line-height: 1.6; max-width: 300px; margin-bottom: 32px; }
    .card {
      background: white;
      border: 1px solid #e2e8e2;
      border-radius: 16px;
      padding: 20px 24px;
      max-width: 320px;
      width: 100%;
      text-align: left;
      margin-bottom: 24px;
    }
    .card h2 { font-size: 13px; font-weight: 600; color: #2d6a4f; margin-bottom: 12px; }
    .card ul { list-style: none; }
    .card li { font-size: 13px; color: #4a5e4a; padding: 4px 0; display: flex; align-items: center; gap: 8px; }
    .card li::before { content: "✓"; color: #2d6a4f; font-weight: 700; }
    button {
      background: #2d6a4f;
      color: white;
      border: none;
      border-radius: 100px;
      padding: 14px 32px;
      font-size: 15px;
      font-weight: 600;
      cursor: pointer;
      transition: opacity 0.2s;
    }
    button:hover { opacity: 0.85; }
    .badge {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      background: #fee2e2;
      color: #991b1b;
      border-radius: 100px;
      padding: 6px 14px;
      font-size: 12px;
      font-weight: 600;
      margin-bottom: 20px;
    }
    .dot { width: 7px; height: 7px; border-radius: 50%; background: #dc2626; }
  </style>
</head>
<body>
  <div class="icon">
    <svg viewBox="0 0 24 24"><path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/></svg>
  </div>

  <div class="badge">
    <span class="dot"></span>
    Fără conexiune
  </div>

  <h1>Ești offline</h1>
  <p>Aplicația Hălchiu Digital nu poate fi accesată fără internet în acest moment.</p>

  <div class="card">
    <h2>Disponibil offline</h2>
    <ul>
      <li>Feed civic (versiunea salvată)</li>
      <li>Lista serviciilor locale</li>
      <li>Evenimentele comunei</li>
      <li>Sesizările tale</li>
    </ul>
  </div>

  <button onclick="window.location.reload()">Încearcă din nou</button>

  <p style="margin-top:24px; font-size:12px; color:#9aab9a;">Hălchiu Digital · Județul Brașov</p>
</body>
</html>
